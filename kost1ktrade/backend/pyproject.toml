[project]
name = "kost1ktrade-backend"
version = "0.1.0"
description = "Backend for the Kost1kTrade application"
authors = [
    {name = "User", email = "user@example.com"},
]
requires-python = ">=3.12"
dependencies = [
    # Веб-сервер и API
    "fastapi==0.111.0",
    "uvicorn==0.30.1",
    "starlette==0.37.2",
    "sqlalchemy==2.0.31",
    "pydantic==2.8.2",
    "pydantic-settings==2.3.4",
    # Основа для научных вычислений и ML (проверенный набор)
    "numpy>=2.2.6",
    "pandas",
    "scikit-learn",
    "statsmodels",
    "pyarrow",
    "shap",
    "lightgbm",
    "optuna",
    # Финансы
    "ccxt==4.5.3",
    "yfinance==0.2.40",
    "TA-Lib",
    # Утилиты и NLP
    "requests==2.32.3",
    "python-telegram-bot[job-queue]==21.4",
    "APScheduler==3.10.4",
    "matplotlib==3.9.1",
    "textblob==0.18.0.post0",
    "vaderSentiment==3.3.2",
    "feedparser==6.0.11",
    "apify-client",
]

[tool.pdm]
venv.in-project = true

[dependency-groups]
dev = [
    "ruff>=0.12.12",
]

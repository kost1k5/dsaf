<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kost1kTrade</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0a1a; /* Dark blue, almost black */
            background-image: radial-gradient(circle, #1a1a3a 1px, transparent 1px);
            background-size: 20px 20px;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            border: 1px solid #4a4a7a;
            padding: 40px 60px;
            border-radius: 15px;
            background-color: rgba(10, 10, 26, 0.5);
            box-shadow: 0 0 25px rgba(74, 74, 122, 0.5);
        }

        h1 {
            font-size: 4em;
            margin: 0;
            color: #fff;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #6a6aff, 0 0 20px #6a6aff, 0 0 30px #ffffff;
        }

        p {
            font-size: 1.5em;
            margin-top: 10px;
            color: #c0c0ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kost1kTrade</h1>
        <p>Скоро здесь будет космос!</p>

</body>
</html>
